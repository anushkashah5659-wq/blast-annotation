name: BLAST search

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  blast:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Biopython
        run: pip install biopython
      - name: Download query source (phiX174 genome, NCBI NC_001422.1)
        run: |
          mkdir -p data output
          curl -sSf -o data/phix174.fasta "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=nuccore&id=NC_001422.1&rettype=fasta"
      - name: Run BLAST (positions 1-800 of the genome as query)
        run: python3 blast_search.py data/phix174.fasta --start 1 --end 800 --program blastn --database nt --evalue 1e-5 --max-hits 25 --top 10 --outdir output
      - name: Save results to the repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data output
          git diff --staged --quiet || (git commit -m "Add BLAST output and annotation table" && git push)
